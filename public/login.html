<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - Conferência de Notas Fiscais</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --ink:#1c2733; --muted:#5b6b7b; --line:#d9e0e8; --brand:#1f4e78; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14191f; --card:#1d252e; --ink:#e6ecf2; --muted:#9aa9b8; --line:#2d3946; --brand:#5aa0d6; --bad:#f08a80; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,Segoe UI,sans-serif; padding:16px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px; width:100%; max-width:360px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 18px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font-size:15px; }
  button { margin-top:18px; width:100%; background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .err { color:var(--bad); font-weight:600; margin-top:12px; min-height:1.4em; }
  .chave { display:none; }
  .chave.on { display:block; }
  .adm { display:flex; align-items:center; gap:8px; font-weight:400; margin-top:12px; }
  .adm input { width:auto; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Conferência de Notas Fiscais</h1>
  <p>Entre para continuar.</p>
  <label for="usuario">Usuário</label>
  <input id="usuario" name="usuario" autocomplete="username" required autofocus>
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" required>
  <div id="chaveBox" class="chave">
    <label for="chave">Chave do administrador</label>
    <input id="chave" name="chave" type="password" autocomplete="off">
  </div>
  <label class="adm"><input type="checkbox" id="souAdm"> Sou administrador</label>
  <button id="go" type="submit">Entrar</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
const souAdm = document.getElementById('souAdm');
souAdm.addEventListener('change', () => document.getElementById('chaveBox').classList.toggle('on', souAdm.checked));
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = ''; go.disabled = true;
  try {
    const body = { usuario: f.usuario.value, senha: f.senha.value, chave: souAdm.checked ? f.chave.value : '' };
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro || 'Falha ao entrar.');
    location.href = '/';
  } catch (x) { err.textContent = x.message; } finally { go.disabled = false; }
});
</script>
</body>
</html>
